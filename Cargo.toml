[package]
name = "typeshi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "lock in fn. A joke language that really works: slang over Rust that compiles to Solana programs (Anchor 1.2). Made by Tickerz."
license = "MIT"
repository = "https://github.com/tickerzhq/typeshi"
homepage = "https://typeshi.tickerz.com"
readme = "README.md"
keywords = ["solana", "anchor", "transpiler", "esolang", "joke"]
categories = ["development-tools", "compilers", "command-line-utilities"]
autoexamples = false
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/**",
    "docs/checks/**",
    "editors/vscode/**",
    "hooks/commit-msg",
    ".gitattributes",
    "README.md",
    "SECURITY.md",
    "LICENSE",
    "Cargo.toml",
]

[lib]
name = "typeshi"
path = "src/lib.rs"

[[bin]]
name = "typeshi"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
prettyplease = "0.3"

[dev-dependencies]
serde_json = "1.0.154"
